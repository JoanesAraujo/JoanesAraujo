name: Snake Game

on:
  schedule:
    # Atualiza diariamente às 03:15 UTC.
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v5
        with:
          ref: output
          path: output
          fetch-depth: 1

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish generated files
        shell: bash
        run: |
          set -euo pipefail

          cp dist/github-contribution-grid-snake.svg output/
          cp dist/github-contribution-grid-snake-dark.svg output/

          cd output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin HEAD:output
